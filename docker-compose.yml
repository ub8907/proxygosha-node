services:
  proxygosha:
    build: .
    container_name: proxygosha-node
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - proxygosha_storage:/app/storage

volumes:
  proxygosha_storage:
