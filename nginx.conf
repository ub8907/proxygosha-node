# ProxyGosha PHP — Nginx 默认网站配置（PHP-FPM index.php + Workerman WebSocket）
# 适用于 Nginx / 宝塔面板 / 1Panel / LNMP

server {
    listen 3000;
    listen [::]:3000;
    # 若直接绑定公网域名：
    # listen 80;
    # server_name tg.yourdomain.com;

    # 推荐将站点根目录指向 public/（或项目根目录，两者均内置 index.php）
    root /var/www/proxygosha/public;
    index index.php;

    client_max_body_size 1m;

    # 禁止访问内部代码、配置与持久化目录
    location ~* ^/(\.env|composer\.|start\.php|nginx\.conf|Dockerfile|docker-compose|app/|storage/|vendor/) {
        return 404;
    }

    # 静态资源直接由 Nginx 高速输出
    location ^~ /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Telegram WebSocket 代理长连接转发至后台 Workerman（默认监听 127.0.0.1:3001）
    location = /api/v1/ws {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header CF-Ray $http_cf_ray;
        proxy_set_header CF-Visitor $http_cf_visitor;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    # 其余全部网站路由（/、/ADMIN_KEY、/?bridge=、/api/v1/session、/health）由 index.php 默认入口处理
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        # 根据本机 PHP-FPM 版本调整路径（例如 unix:/run/php/php8.3-fpm.sock 或 127.0.0.1:9000）
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}
